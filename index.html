<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dr. Akanksha Nayak - Level 25 Cyberpunk Birthday</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b061a;
            --neon-pink: #ff2a85;
            --neon-cyan: #05d9e8;
            --neon-yellow: #ffde59;
            --neon-purple: #b967ff;
            --dark-card: #150b2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            image-rendering: pixelated;
        }

        body {
            background-color: var(--bg-color);
            color: #ffffff;
            font-family: 'VT323', monospace;
            overflow-x: hidden;
            position: relative;
        }

        /* CRT Scanlines Overlay */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 99999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(180deg, #1b0c3d 0%, var(--bg-color) 100%);
            border-bottom: 4px solid var(--neon-cyan);
            position: relative;
        }

        .pixel-font {
            font-family: 'Press Start 2P', cursive;
        }

        h1 {
            font-size: clamp(1rem, 3vw, 1.8rem);
            color: var(--neon-yellow);
            text-shadow: 3px 3px var(--neon-pink);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            color: var(--neon-cyan);
            letter-spacing: 2px;
            text-shadow: 2px 2px var(--neon-purple);
        }

        /* Hero Container */
        .hero-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            text-align: center;
        }

        .portrait-frame {
            border: 4px solid var(--neon-pink);
            box-shadow: 0 0 20px var(--neon-pink), inset 0 0 15px var(--neon-cyan);
            padding: 8px;
            background: var(--dark-card);
            border-radius: 8px;
            margin-bottom: 25px;
            max-width: 320px;
            width: 100%;
        }

        .portrait-frame img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }

        /* Celebrate Button */
        .arcade-btn {
            background-color: var(--neon-pink);
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: clamp(0.7rem, 2vw, 1rem);
            padding: 15px 30px;
            border: 4px solid var(--neon-yellow);
            box-shadow: 0 6px 0 #8b0046, 0 0 15px var(--neon-pink);
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.1s ease;
            margin: 20px 0;
            display: inline-block;
        }

        .arcade-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8b0046, 0 0 10px var(--neon-pink);
        }

        /* Magazine 3D Flip Container */
        .magazine-section {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: var(--dark-card);
            border: 4px solid var(--neon-purple);
            box-shadow: 0 0 30px rgba(185, 103, 255, 0.3);
            border-radius: 12px;
            text-align: center;
        }

        .magazine-title {
            font-family: 'Press Start 2P', cursive;
            font-size: 1.1rem;
            color: var(--neon-cyan);
            margin-bottom: 20px;
            text-shadow: 2px 2px var(--neon-pink);
        }

        /* 3D Flip Book Wrapper */
        .book-container {
            perspective: 1500px;
            width: 100%;
            max-width: 550px;
            margin: 0 auto;
            min-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .book-page {
            width: 100%;
            background: #000;
            border: 3px solid var(--neon-yellow);
            box-shadow: 0 0 20px rgba(255, 222, 89, 0.3);
            border-radius: 6px;
            transform-origin: left center;
            transition: transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.6s;
            backface-visibility: hidden;
            display: block;
        }

        .book-page.flip-out-next {
            transform: rotateY(-180deg);
            opacity: 0;
        }

        .book-page.flip-out-prev {
            transform: rotateY(180deg);
            opacity: 0;
        }

        .magazine-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .nav-btn {
            background-color: var(--neon-cyan);
            color: #0b061a;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.7rem;
            padding: 12px 22px;
            border: 3px solid var(--neon-yellow);
            cursor: pointer;
            box-shadow: 0 4px 0 #007a85;
            transition: all 0.1s;
        }

        .nav-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #007a85;
        }

        .page-indicator {
            font-size: 1.5rem;
            color: var(--neon-yellow);
            letter-spacing: 2px;
        }

        /* Particle Canvas */
        #fx-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        footer {
            text-align: center;
            padding: 30px;
            font-size: 1.2rem;
            color: var(--neon-purple);
            border-top: 2px solid #20104d;
        }
    </style>
</head>
<body>

    <canvas id="fx-canvas"></canvas>

    <header>
        <h1 class="pixel-font">⭐ DR. AKANKSHA NAYAK ⭐</h1>
        <p class="subtitle pixel-font">LEVEL 25 UNLOCKED • OCT 11, 2026</p>
    </header>

    <div class="hero-container">
        <div class="portrait-frame">
            <img id="portrait-img" src="pixel_portrait.jpeg" alt="Dr. Akanksha Pixel Portrait" 
                 onerror="if(this.src.endsWith('.jpeg')){this.src='pixel_portrait.jpg';} else {this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'300\' height=\'300\'><rect width=\'300\' height=\'300\' fill=\'%23150b2e\'/><text x=\'50%\' y=\'50%\' dominant-baseline=\'middle\' text-anchor=\'middle\' fill=\'%23ff2a85\' font-family=\'monospace\' font-size=\'16\'>pixel_portrait.jpeg / .jpg missing</text></svg>';}">
        </div>
        <button class="arcade-btn" id="celebrate-btn">▶ CELEBRATE LEVEL 25! ✨</button>
    </div>

    <section class="magazine-section">
        <h2 class="magazine-title">📖 VIRTUAL 3D FLIP MAGAZINE (13 PAGES)</h2>
        <div class="book-container">
            <img id="mag-page" class="book-page" src="page1.jpeg" alt="Magazine Spread" 
                 onerror="handleImageError(this)">
        </div>
        <div class="magazine-controls">
            <button class="nav-btn" id="prev-btn">◀ PREV</button>
            <span class="page-indicator" id="page-indicator">PAGE 1 / 13</span>
            <button class="nav-btn" id="next-btn">NEXT ▶</button>
        </div>
    </section>

    <footer>
        <p>Made with ❤️ by Aaditya for Akanksha</p>
    </footer>

    <script>
        // Automatic JPEG extension fallback (.jpeg or .jpg)
        function handleImageError(imgElem) {
            if (imgElem.src.endsWith('.jpeg')) {
                imgElem.src = imgElem.src.replace('.jpeg', '.jpg');
            } else {
                imgElem.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800'><rect width='600' height='800' fill='%23150b2e'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' fill='%2305d9e8' font-family='monospace' font-size='18'>Upload page " + currentPage + " (.jpeg / .jpg)</text></svg>";
            }
        }

        // Magazine 3D Flip Navigation Logic
        let currentPage = 1;
        const totalPages = 13;
        const magImg = document.getElementById('mag-page');
        const pageIndicator = document.getElementById('page-indicator');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        let isAnimating = false;

        function flipToPage(newPage, direction) {
            if (isAnimating || newPage === currentPage) return;
            isAnimating = true;

            // Trigger 3D flip out animation
            magImg.classList.add(direction === 'next' ? 'flip-out-next' : 'flip-out-prev');

            setTimeout(() => {
                currentPage = newPage;
                magImg.src = `page${currentPage}.jpeg`;
                pageIndicator.textContent = `PAGE ${currentPage} / ${totalPages}`;

                // Reset position for 3D flip in
                magImg.style.transition = 'none';
                magImg.style.transform = direction === 'next' ? 'rotateY(180deg)' : 'rotateY(-180deg)';
                
                setTimeout(() => {
                    magImg.style.transition = 'transform 0.6s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.6s';
                    magImg.classList.remove('flip-out-next', 'flip-out-prev');
                    magImg.style.transform = 'rotateY(0deg)';
                    magImg.style.opacity = '1';
                    isAnimating = false;
                }, 50);
            }, 300);
        }

        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                flipToPage(currentPage - 1, 'prev');
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentPage < totalPages) {
                flipToPage(currentPage + 1, 'next');
            }
        });

        // Touch Swipe Support for Mobile
        let touchStartX = 0;
        magImg.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, {passive: true});

        magImg.addEventListener('touchend', e => {
            let touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 40 && currentPage < totalPages) {
                flipToPage(currentPage + 1, 'next');
            }
            if (touchEndX > touchStartX + 40 && currentPage > 1) {
                flipToPage(currentPage - 1, 'prev');
            }
        }, {passive: true});

        // Confetti & Fireworks Engine
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor(x, y, color, isFirework = false) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 6 + 4;
                const angle = Math.random() * Math.PI * 2;
                const speed = isFirework ? (Math.random() * 8 + 2) : (Math.random() * 5 + 1);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.15;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }
            update() {
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(this.alpha, 0);
                ctx.fillStyle = this.color;
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
                ctx.restore();
            }
        }

        function createBurst(x, y, isFirework = false) {
            const colors = ['#ff2a85', '#05d9e8', '#ffde59', '#b967ff', '#ffffff'];
            for (let i = 0; i < 40; i++) {
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color, isFirework));
            }
        }

        function triggerCelebration() {
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const rx = Math.random() * canvas.width;
                    const ry = Math.random() * (canvas.height * 0.6) + (canvas.height * 0.2);
                    createBurst(rx, ry, true);
                }, i * 180);
            }
        }

        document.getElementById('celebrate-btn').addEventListener('click', triggerCelebration);

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
